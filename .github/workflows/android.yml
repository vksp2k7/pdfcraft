name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build WASM frontend and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-wasm

      - name: Install pinned Trunk binary
        shell: bash
        run: |
          set -euo pipefail
          version=0.21.14
          archive="$RUNNER_TEMP/trunk-${version}.tar.gz"
          install_dir="$RUNNER_TEMP/trunk-bin"
          curl --fail --location --retry 3 \
            "https://github.com/trunk-rs/trunk/releases/download/v${version}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trunk" --version

      - name: Build WASM frontend and Android APK
        run: ./android/build-apk.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-android-debug
          path: dist/android/pdfcraft-android-0.9.0-debug.apk
          if-no-files-found: error
          retention-days: 14
